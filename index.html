<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PhotoPop — Photoshop‑style Editor</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div class="app" id="app">
      <header>
        <div class="brand"><div class="logo"></div> PhotoPop</div>
        <div class="menubar">
          <div class="menu" id="menuFileWrap">
            <button class="menubtn" id="menuFileBtn">File</button>
            <div class="menu-list" id="menuFile">
              <button class="menu-item" id="fileNew">New… <span class="accel">⌘N</span></button>
              <button class="menu-item" id="fileOpen">Open… <span class="accel">⌘O</span></button>
              <button class="menu-item" id="fileOpenAsLayers">🚧 Open as Layers… <span class="accel">TODO</span></button>
              <button class="menu-item" id="fileOpenLocation">🚧 Open Location… <span class="accel">TODO</span></button>
              <button class="menu-item" id="fileOpenRecent">🚧 Open Recent <span class="accel">TODO</span></button>
              <div class="menu-sep"></div>
              <button class="menu-item" id="fileSave">🚧 Save <span class="accel">⌘S</span></button>
              <button class="menu-item" id="fileSaveAs">🚧 Save As… <span class="accel">⇧⌘S</span></button>
              <button class="menu-item" id="fileSaveCopy">🚧 Save a Copy… <span class="accel">TODO</span></button>
              <button class="menu-item" id="fileRevert">🚧 Revert <span class="accel">TODO</span></button>
              <div class="menu-sep"></div>
              <button class="menu-item" id="fileExportAs">Export As… <span class="accel">⇧⌘E</span></button>
              <button class="menu-item" id="fileExportPNG">Export PNG</button>
              <button class="menu-item" id="fileExportJPG">Export JPG</button>
              <button class="menu-item" id="fileOverwriteExport">🚧 Overwrite Export <span class="accel">⌘E</span></button>
              <div class="menu-sep"></div>
              <button class="menu-item" id="fileImport">🚧 Import <span class="accel">TODO</span></button>
              <div class="menu-sep"></div>
              <button class="menu-item" id="filePrint">🚧 Print… <span class="accel">⌘P</span></button>
              <button class="menu-item" id="filePrintSize">🚧 Print Size… <span class="accel">TODO</span></button>
              <div class="menu-sep"></div>
              <button class="menu-item" id="fileSaveProject">Save Project</button>
              <button class="menu-item" id="fileCloseAll">🚧 Close All <span class="accel">⇧⌘W</span></button>
              <button class="menu-item" id="fileQuit">🚧 Quit <span class="accel">⌘Q</span></button>
            </div>
          </div>
          <div class="menu" id="menuEditWrap">
            <button class="menubtn" id="menuEditBtn">Edit</button>
            <div class="menu-list" id="menuEdit">
              <button class="menu-item" id="editUndo">Undo <span class="accel">⌘Z</span></button>
              <button class="menu-item" id="editRedo">Redo <span class="accel">⇧⌘Z</span></button>
              <button class="menu-item" id="editFade">🚧 Fade… <span class="accel">TODO</span></button>
              <div class="menu-sep"></div>
              <button class="menu-item" id="editCut">🚧 Cut <span class="accel">⌘X</span></button>
              <button class="menu-item" id="editCopy">🚧 Copy <span class="accel">⌘C</span></button>
              <button class="menu-item" id="editCopyVisible">🚧 Copy Visible <span class="accel">TODO</span></button>
              <button class="menu-item" id="editPaste">🚧 Paste <span class="accel">⌘V</span></button>
              <button class="menu-item" id="editPasteAs">🚧 Paste As <span class="accel">TODO</span></button>
              <button class="menu-item" id="editPasteInto">🚧 Paste Into <span class="accel">TODO</span></button>
              <div class="menu-sep"></div>
              <button class="menu-item" id="editClear">🚧 Clear <span class="accel">Delete</span></button>
              <button class="menu-item" id="editFill">🚧 Fill with FG Color <span class="accel">TODO</span></button>
              <button class="menu-item" id="editStroke">🚧 Stroke Selection <span class="accel">TODO</span></button>
              <div class="menu-sep"></div>
              <button class="menu-item" id="editPreferences">🚧 Preferences <span class="accel">⌘,</span></button>
            </div>
          </div>
                    <div class="menu" id="menuSelectWrap">
            <button class="menubtn" id="menuSelectBtn">Select</button>
            <div class="menu-list" id="menuSelect">
              <button class="menu-item" id="selectAll">🚧 All <span class="accel">⌘A</span></button>
              <button class="menu-item" id="selectNone">🚧 None <span class="accel">⇧⌘A</span></button>
              <button class="menu-item" id="selectInvert">🚧 Invert <span class="accel">⌘I</span></button>
              <button class="menu-item" id="selectFloat">🚧 Float <span class="accel">⇧⌘L</span></button>
              <div class="menu-sep"></div>
              <button class="menu-item" id="selectByColor">🚧 By Color <span class="accel">TODO</span></button>
              <button class="menu-item" id="selectFromPath">🚧 From Path <span class="accel">TODO</span></button>
              <div class="menu-sep"></div>
              <button class="menu-item" id="selectFeather">🚧 Feather… <span class="accel">TODO</span></button>
              <button class="menu-item" id="selectGrow">🚧 Grow… <span class="accel">TODO</span></button>
              <button class="menu-item" id="selectShrink">🚧 Shrink… <span class="accel">TODO</span></button>
              <button class="menu-item" id="selectBorder">🚧 Border… <span class="accel">TODO</span></button>
              <div class="menu-sep"></div>
              <button class="menu-item" id="selectSave">🚧 Save to Channel <span class="accel">TODO</span></button>
              <button class="menu-item" id="selectPath">🚧 To Path <span class="accel">TODO</span></button>
            </div>
          </div>
                    <div class="menu" id="menuViewWrap">
            <button class="menubtn" id="menuViewBtn">View</button>
            <div class="menu-list" id="menuView">
              <button class="menu-item" id="viewZoomIn">🚧 Zoom In <span class="accel">⌘+</span></button>
              <button class="menu-item" id="viewZoomOut">🚧 Zoom Out <span class="accel">⌘-</span></button>
              <button class="menu-item" id="viewZoomFit">🚧 Fit Page in Window <span class="accel">⌘E</span></button>
              <button class="menu-item" id="viewZoom100">🚧 Zoom to Selection <span class="accel">TODO</span></button>
              <div class="menu-sep"></div>
              <button class="menu-item" id="viewFullscreen">🚧 Fullscreen <span class="accel">F11</span></button>
              <div class="menu-sep"></div>
              <button class="menu-item" id="viewShowAll">🚧 Show All <span class="accel">TODO</span></button>
              <button class="menu-item" id="viewDotForDot">🚧 Dot for Dot <span class="accel">TODO</span></button>
              <div class="menu-sep"></div>
              <button class="menu-item" id="viewShowGuides">🚧 Show Guides <span class="accel">TODO</span></button>
              <button class="menu-item" id="viewSnapGuides">🚧 Snap to Guides <span class="accel">TODO</span></button>
              <button class="menu-item" id="viewShowGrid">🚧 Show Grid <span class="accel">TODO</span></button>
              <button class="menu-item" id="viewSnapGrid">🚧 Snap to Grid <span class="accel">TODO</span></button>
              <div class="menu-sep"></div>
              <button class="menu-item" id="viewShowRulers">🚧 Show Rulers <span class="accel">TODO</span></button>
              <button class="menu-item" id="viewShowScrollbars">🚧 Show Scrollbars <span class="accel">TODO</span></button>
              <button class="menu-item" id="viewShowSelection">🚧 Show Selection <span class="accel">TODO</span></button>
              <button class="menu-item" id="viewShowLayer">🚧 Show Layer Boundary <span class="accel">TODO</span></button>
            </div>
          </div>
                    <div class="menu" id="menuLayerWrap">
            <button class="menubtn" id="menuLayerBtn">Layer</button>
            <div class="menu-list" id="menuLayer">
              <button class="menu-item" id="layerNew">🚧 New Layer… <span class="accel">⇧⌘N</span></button>
              <button class="menu-item" id="layerDuplicate">🚧 Duplicate Layer <span class="accel">TODO</span></button>
              <button class="menu-item" id="layerAnchor">🚧 Anchor Layer <span class="accel">⌘H</span></button>
              <button class="menu-item" id="layerMergeDown">🚧 Merge Down <span class="accel">TODO</span></button>
              <button class="menu-item" id="layerFlatten">🚧 Flatten Image <span class="accel">TODO</span></button>
              <div class="menu-sep"></div>
              <button class="menu-item" id="layerTextAlongPath">🚧 Text along Path <span class="accel">TODO</span></button>
              <div class="menu-sep"></div>
              <button class="menu-item" id="layerScale">🚧 Scale Layer… <span class="accel">TODO</span></button>
              <button class="menu-item" id="layerCrop">🚧 Crop to Selection <span class="accel">TODO</span></button>
              <button class="menu-item" id="layerRotate">🚧 Transform <span class="accel">TODO</span></button>
              <div class="menu-sep"></div>
              <button class="menu-item" id="layerTransparency">🚧 Transparency <span class="accel">TODO</span></button>
              <button class="menu-item" id="layerMask">🚧 Layer Mask <span class="accel">TODO</span></button>
              <div class="menu-sep"></div>
              <button class="menu-item" id="layerDelete">🚧 Delete Layer <span class="accel">TODO</span></button>
            </div>
          </div>
                    <div class="menu" id="menuColorsWrap">
            <button class="menubtn" id="menuColorsBtn">Colors</button>
            <div class="menu-list" id="menuColors">
              <button class="menu-item" id="colorsForeground">🚧 Foreground Color… <span class="accel">TODO</span></button>
              <button class="menu-item" id="colorsBackground">🚧 Background Color… <span class="accel">TODO</span></button>
              <button class="menu-item" id="colorsSwap">🚧 Swap Colors <span class="accel">X</span></button>
              <button class="menu-item" id="colorsDefault">🚧 Default Colors <span class="accel">D</span></button>
              <div class="menu-sep"></div>
              <button class="menu-item" id="colorsInvert">🚧 Invert <span class="accel">TODO</span></button>
              <button class="menu-item" id="colorsDesaturate">🚧 Desaturate <span class="accel">TODO</span></button>
              <div class="menu-sep"></div>
              <button class="menu-item" id="colorsBrightness">🚧 Brightness-Contrast… <span class="accel">TODO</span></button>
              <button class="menu-item" id="colorsHueSaturation">🚧 Hue-Saturation… <span class="accel">TODO</span></button>
              <button class="menu-item" id="colorsColorBalance">🚧 Color Balance… <span class="accel">TODO</span></button>
              <button class="menu-item" id="colorsCurves">🚧 Curves… <span class="accel">TODO</span></button>
              <button class="menu-item" id="colorsLevels">🚧 Levels… <span class="accel">TODO</span></button>
              <div class="menu-sep"></div>
              <button class="menu-item" id="colorsAutoNormalize">🚧 Auto Normalize <span class="accel">TODO</span></button>
              <button class="menu-item" id="colorsAutoWhiteBalance">🚧 Auto White Balance <span class="accel">TODO</span></button>
              <button class="menu-item" id="colorsAutoColorEnhance">🚧 Auto Color Enhance <span class="accel">TODO</span></button>
            </div>
          </div>
                    <div class="menu" id="menuToolsWrap">
            <button class="menubtn" id="menuToolsBtn">Tools</button>
            <div class="menu-list" id="menuTools">
              <button class="menu-item" id="toolsSelection">🚧 Selection Tools <span class="accel">TODO</span></button>
              <button class="menu-item" id="toolsPaint">🚧 Paint Tools <span class="accel">TODO</span></button>
              <button class="menu-item" id="toolsTransform">🚧 Transform Tools <span class="accel">TODO</span></button>
              <button class="menu-item" id="toolsColor">🚧 Color Tools <span class="accel">TODO</span></button>
              <div class="menu-sep"></div>
              <button class="menu-item" id="toolsRectSelect">🚧 Rectangle Select <span class="accel">R</span></button>
              <button class="menu-item" id="toolsEllipseSelect">🚧 Ellipse Select <span class="accel">E</span></button>
              <button class="menu-item" id="toolsFreeSelect">🚧 Free Select <span class="accel">F</span></button>
              <button class="menu-item" id="toolsFuzzySelect">🚧 Fuzzy Select <span class="accel">U</span></button>
              <button class="menu-item" id="toolsByColorSelect">🚧 By Color Select <span class="accel">⇧O</span></button>
              <div class="menu-sep"></div>
              <button class="menu-item" id="toolsPaintbrush">🚧 Paintbrush <span class="accel">P</span></button>
              <button class="menu-item" id="toolsPencil">🚧 Pencil <span class="accel">N</span></button>
              <button class="menu-item" id="toolsEraser">🚧 Eraser <span class="accel">⇧E</span></button>
              <button class="menu-item" id="toolsAirbrush">🚧 Airbrush <span class="accel">A</span></button>
              <button class="menu-item" id="toolsClone">🚧 Clone <span class="accel">C</span></button>
              <button class="menu-item" id="toolsHeal">🚧 Heal <span class="accel">H</span></button>
              <button class="menu-item" id="toolsPerspective">🚧 Perspective <span class="accel">⇧P</span></button>
              <div class="menu-sep"></div>
              <button class="menu-item" id="toolsBucketFill">🚧 Bucket Fill <span class="accel">⇧B</span></button>
              <button class="menu-item" id="toolsGradient">🚧 Gradient <span class="accel">G</span></button>
              <button class="menu-item" id="toolsText">🚧 Text <span class="accel">T</span></button>
            </div>
          </div>
                    <div class="menu" id="menuHelpWrap">
            <button class="menubtn" id="menuHelpBtn">Help</button>
            <div class="menu-list" id="menuHelp">
              <button class="menu-item" id="helpHelp">🚧 Help <span class="accel">F1</span></button>
              <button class="menu-item" id="helpContextHelp">🚧 Context Help <span class="accel">⇧F1</span></button>
              <button class="menu-item" id="helpTipOfDay">🚧 Tip of the Day <span class="accel">TODO</span></button>
              <div class="menu-sep"></div>
              <button class="menu-item" id="helpUserManual">🚧 User Manual <span class="accel">TODO</span></button>
              <button class="menu-item" id="helpGIMPOnline">🚧 GIMP Online <span class="accel">TODO</span></button>
              <button class="menu-item" id="helpPluginBrowser">🚧 Plugin Browser <span class="accel">TODO</span></button>
              <div class="menu-sep"></div>
              <button class="menu-item" id="helpProcedureBrowser">🚧 Procedure Browser <span class="accel">TODO</span></button>
              <div class="menu-sep"></div>
              <button class="menu-item" id="helpAbout">🚧 About PhotoPop <span class="accel">TODO</span></button>
            </div>
          </div>
        </div>
        <input id="fileInput" type="file" accept="image/*,application/json" hidden />
        <div class="toolbar-group">
          <button id="zoomOutBtn" title="Zoom Out (−)">➖</button>
          <button id="zoomResetBtn" title="Reset Zoom (0)">⤢</button>
          <button id="zoomInBtn" title="Zoom In (+)">➕</button>
        </div>
        <div class="toolbar-group" title="Zoom">
          <span class="muted">Zoom</span>
          <input type="range" id="zoomSlider" min="5" max="800" value="100" />
        </div>
        <div class="spacer"></div>
        <div class="toolbar-group" title="Brush size">
          <span class="muted">Size</span>
          <input type="range" id="brushSize" min="1" max="200" value="24" />
          <span id="brushSizeVal">24</span>
        </div>
        <div class="toolbar-group" title="Opacity">
          <span class="muted">Opacity</span>
          <input type="range" id="brushOpacity" min="1" max="100" value="100" />
          <span id="brushOpacityVal">100%</span>
        </div>
      </header>

      <aside class="sidebar" id="sidebar">
        <div class="tool active" data-tool="move" title="Move (V)">📦</div>
        <div class="tool" data-tool="hand" title="Hand/Pan (H or Space)">🤚</div>
        <div class="tool" data-tool="zoom" title="Zoom (Z)">🔎</div>
        <div class="tool" data-tool="marquee" title="Rect Marquee (M)">◻️</div>
  <div class="tool" data-tool="wand" title="Magic Wand (W)">🪄</div>
        <div class="tool" data-tool="brush" title="Brush (B)">🖌️</div>
        <div class="tool" data-tool="eraser" title="Eraser (E)">🩹</div>
        <div class="tool" data-tool="bucket" title="Paint Bucket (G)">🪣</div>
        <div class="tool" data-tool="eyedrop" title="Eyedropper (I)">🎯</div>
        <div class="tool" data-tool="line" title="Line (L)">／</div>
        <div class="tool" data-tool="rect" title="Rectangle (U)">▭</div>
        <div class="tool" data-tool="ellipse" title="Ellipse (O)">⬭</div>
        <div class="tool" data-tool="text" title="Text (T)">🔤</div>
        <div class="tool" data-tool="crop" title="Crop (C)">✂️</div>
        <div style="height:6px"></div>
        <button class="tool" id="addLayerQuick" title="Add Layer">➕</button>
      </aside>

      <main class="workspace checker" id="workspace">
        <div class="canvas-wrap" id="canvasWrap">
          <div class="canvas-bg checker"></div>
          <canvas id="viewport" class="viewport" width="1024" height="768"></canvas>
          <canvas id="overlay" class="overlay" width="1024" height="768"></canvas>
          <textarea id="textEditor" class="text-editor" spellcheck="false"></textarea>
          <div class="drop-hint">Drop images or .pxf project files here</div>
        </div>
      </main>

      <aside class="rightbar">
        <div class="panel">
          <h3>Colors</h3>
          <div class="content">
            <div class="swatches">
              <input type="color" id="fgColor" value="#4ade80" title="Foreground" />
              <input type="color" id="bgColor" value="#1f2937" title="Background" />
              <button id="swapColors" class="btn" title="Swap (X)">↔︎</button>
            </div>
            <div class="row" title="Magic wand tolerance">
              <label>Wand Tol</label>
              <input type="range" id="wandTolerance" min="0" max="128" value="24" />
              <span id="wandToleranceVal">24</span>
            </div>
          </div>
        </div>

        <div class="panel">
          <h3>Brush & Shape</h3>
          <div class="content">
            <div class="row"><label>Hardness</label><input type="range" id="hardness" min="0" max="1" step="0.01" value="0.8"><span id="hardnessVal">0.80</span></div>
            <div class="row"><label>Shape Mode</label>
              <select id="shapeMode">
                <option value="fill">Fill</option>
                <option value="stroke">Stroke</option>
                <option value="both">Fill + Stroke</option>
              </select>
            </div>
            <div class="row"><label>Stroke</label><input type="number" id="strokeWidth" min="1" max="200" value="4" style="width:88px"></div>
            <div class="row"><label>Font</label>
              <select id="fontFamily">
                <option>Inter, system-ui, Arial</option>
                <option>Arial, Helvetica, sans-serif</option>
                <option>Georgia, serif</option>
                <option>Impact, Charcoal, sans-serif</option>
                <option>"Courier New", monospace</option>
              </select>
            </div>
            <div class="row"><label>Font Size</label><input type="number" id="fontSize" min="6" max="256" value="48" style="width:88px"></div>
            <div class="row"><label>Style</label>
              <select id="fontStyle">
                <option value="normal">Normal</option>
                <option value="bold">Bold</option>
                <option value="italic">Italic</option>
                <option value="bold italic">Bold Italic</option>
              </select>
            </div>
            <div class="row"><label>Align</label>
              <select id="textAlign">
                <option value="left">Left</option>
                <option value="center">Center</option>
                <option value="right">Right</option>
              </select>
            </div>
          </div>
        </div>

        <div class="panel">
          <h3>Layers</h3>
          <div class="content">
            <div class="row" style="justify-content:space-between">
              <div>
                <button id="addLayer" class="btn">➕ Add</button>
                <button id="delLayer" class="btn">🗑️ Delete</button>
              </div>
              <div>
                <button id="layerUp" class="btn" title="Move Up">▲</button>
                <button id="layerDown" class="btn" title="Move Down">▼</button>
              </div>
            </div>
            <div class="row">
              <label>Blend</label>
              <select id="blendMode">
                <option>source-over</option>
                <option>multiply</option>
                <option>screen</option>
                <option>overlay</option>
                <option>darken</option>
                <option>lighten</option>
                <option>color-dodge</option>
                <option>color-burn</option>
                <option>hard-light</option>
                <option>soft-light</option>
                <option>difference</option>
                <option>exclusion</option>
                <option>hue</option>
                <option>saturation</option>
                <option>color</option>
                <option>luminosity</option>
              </select>
            </div>
            <div class="row"><label>Opacity</label><input type="range" id="layerOpacity" min="0" max="100" value="100"><span id="layerOpacityVal">100%</span></div>
            <div id="layers" class="layers"></div>
          </div>
        </div>

        <div class="panel">
          <h3>Adjustments</h3>
          <div class="content">
            <div class="row"><label>Brightness</label><input type="range" id="adjBright" min="-100" max="100" value="0"><span id="adjBrightVal">0</span></div>
            <div class="row"><label>Contrast</label><input type="range" id="adjContrast" min="-100" max="100" value="0"><span id="adjContrastVal">0</span></div>
            <div class="row"><label>Grayscale</label><input type="checkbox" id="adjGray"></div>
            <div class="row" style="justify-content:space-between">
              <button class="btn" id="applyAdj">Apply to Layer</button>
              <button class="btn" id="resetAdj">Reset</button>
            </div>
          </div>
        </div>
      </aside>

      <footer>
        <div>Tool: <span id="statusTool">Move</span></div>
        <div>| Zoom: <span id="statusZoom">100%</span></div>
        <div>| Coords: <span id="statusXY">–, –</span></div>
        <div class="spacer"></div>
        <div>Hints: <span class="kbd">Space</span> pan · <span class="kbd">⌘/Ctrl+Z</span> undo · <span class="kbd">X</span> swap colors</div>
      </footer>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
  </html>
